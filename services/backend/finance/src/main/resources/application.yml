storage:
  certs-dir: ${STORAGE_CERTS_DIR}

server:
  port: 8082
  forward-headers-strategy: framework

auth:
  base-url: ${AUTH_BASE_URL}
  internal-token: ${AUTH_INTERNAL_TOKEN}
  cookie-name: ${AUTH_COOKIE_NAME:sid}

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: finance
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      connection-timeout: 30000

# Porta mantida em 8082 para consistência com docker-compose
server:
  port: 8082
