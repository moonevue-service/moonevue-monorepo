server:
  port: 8080

logging:
  level:
    com.moonevue.gateway.service.OAuthTokenService: DEBUG
    com.moonevue.gateway.mtls.MutualTlsHttpService: DEBUG
    com.moonevue.gateway.http.DefaultRequestSenderFactory: DEBUG
  forward-headers-strategy: framework

auth:
  base-url: ${AUTH_BASE_URL}
  internal-token: ${AUTH_INTERNAL_TOKEN}
  cookie-name: ${AUTH_COOKIE_NAME:sid}

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

moonevue:
  gateway:
    api-keys:
      pepper: ${API_KEY_PEPPER:moonevue-dev-pepper-change-me}
      rate-limit-per-minute: ${API_KEY_RATE_LIMIT_PER_MINUTE:120}
    webhooks:
      hmac:
        secret: ${WEBHOOK_HMAC_SECRET}
        header: X-Signature
      asaas:
        token: ${ASAAS_WEBHOOK_TOKEN:}
        header: ${ASAAS_WEBHOOK_HEADER:asaas-access-token}
      timestamp:
        header: X-Signature-Timestamp
        skew-seconds: 300

banks:
  efi:
    production: false
  asaas:
    api-key: ${ASAAS_API_KEY:}
    sandbox-base-url: https://api-sandbox.asaas.com
    production-base-url: https://api.asaas.com
    user-agent: Moonevue/1.0

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}


# Perfil docker (ativado via SPRING_PROFILES_ACTIVE=docker no docker-compose)
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      connection-timeout: 30000

server:
  port: 8080
